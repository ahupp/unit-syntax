[project]
name = "unit-syntax"
version = "0.4.0"
description = "Physical unit literals for Jupyter and IPython"
readme = "README.md"
authors = [{ name = "Adam Hupp", email = "adam@hupp.org" }]
requires-python = ">=3.10,<4"
dependencies = [
    "Pint>=0.24.4; python_version < '3.11'",
    "Pint>=0.25.3; python_version >= '3.11' and python_version < '3.12'",
    "Pint>=0.26.2; python_version >= '3.12'",
    "ipython>=8; python_version < '3.11'",
    "ipython>=9; python_version >= '3.11'",
    "pegen>=0.3,<0.4",
]

[project.optional-dependencies]
check = ["ty>=0.0.95"]

[project.scripts]
unit-syntax = "unit_syntax.cli:main"

[project.urls]
Repository = "https://github.com/ahupp/unit-syntax"

[dependency-groups]
dev = [
    "pytest>=8",
    "black>=25",
    "numpy>=1.24.3; python_version < '3.11'",
    "numpy>=2.4; python_version >= '3.11' and python_version < '3.12'",
    "numpy>=2.5.4; python_version >= '3.12'",
    "ty==0.0.95",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = [
    "CHANGELOG.md", "GRAMMAR.md", "VALIDATION.md", "python_units.gram",
    "scripts/**", "test/**", "examples/**", "uv.lock",
]

[tool.ty.src]
# pegen generates the parser; its public interface is checked via parser.pyi.
exclude = ["unit_syntax/parser.py"]

[tool.black]
include = '\.pyi?$'
extend-exclude = 'parser.py$'
