[tool.poetry]
name = "unit-syntax"
version = "0.4.0.dev0"
authors = ["Adam Hupp <adam@hupp.org>"]
packages = [{ include = "unit_syntax" }]
readme = "README.md"
repository = "https://github.com/ahupp/unit-syntax"
description = "Physical unit literals for Jupyter and IPython"

[tool.poetry.dependencies]
python = ">=3.10, < 4"
Pint = [
    {version = ">=0.24.4", python = "<3.11"},
    {version = ">=0.25.3", python = ">=3.11,<3.12"},
    {version = ">=0.26.2", python = ">=3.12"},
]
ipython = [
    {version = ">=8", python = "<3.11"},
    {version = ">=9", python = ">=3.11"},
]
pegen = "^0.3"
ty = {version = ">=0.0.95", optional = true}

[tool.poetry.extras]
check = ["ty"]

[tool.poetry.scripts]
unit-syntax = "unit_syntax.check:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
black = ">=25"
numpy = [
    {version = ">=1.24.3", python = "<3.11"},
    {version = ">=2.4", python = ">=3.11,<3.12"},
    {version = ">=2.5.4", python = ">=3.12"},
]
ty = ">=0.0.95"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
include = '\.pyi?$'
extend-exclude = 'parser.py$'
