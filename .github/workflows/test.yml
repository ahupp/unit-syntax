name: Python grammar and dimension checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.24'
      - run: uv sync --locked
      - name: Type check the library and its stubs
        run: uv run --locked ty check unit_syntax
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Verify generated dimensional typing
        run: uv run --locked python scripts/generate_typing.py && git diff --exit-code unit_syntax/typing.pyi
      - name: Verify generated parser
        run: uv run --locked python -m pegen python_units.gram -o unit_syntax/parser.py && git diff --exit-code unit_syntax/parser.py
      - name: Build distributions
        run: uv build
